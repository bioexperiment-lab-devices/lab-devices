[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "experiment-studio"
version = "1.5.3" # x-release-please-version
description = "Web UI for building and running lab_devices experiments."
requires-python = ">=3.11"
dependencies = [
    "bioexperiment-lab-devices",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.4",
    "httpx>=0.27",
    "httpx-ws>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["experiment_studio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["experiment_studio"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Ruff's DEFAULT rule set is not a stable contract, and this package installs ruff unpinned
# (`ruff>=0.4` in the dev extra, no lock file — unlike the library, whose poetry.lock holds it at
# 0.15.20). 0.16 widened the defaults to include bugbear, isort, bandit and blind-except, which
# turned the backend lint red on every branch at once — main included — without a line of code
# changing: 71 findings, 37 of them B008 on FastAPI's own `Depends(...)` idiom.
#
# So state the set this package has actually been linted under since it was created — ruff's
# historical default — rather than inheriting whatever a future release decides it should be.
# Adopting a wider set stays possible; it is then a deliberate change with its fixes in the same
# commit, which is the opposite of what a background release upgrade gives you.
select = ["E4", "E7", "E9", "F"]
